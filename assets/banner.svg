<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- broom icon -->
  <g transform="translate(64,72)">
    <rect x="-14" y="-8" width="120" height="10" rx="5" fill="#8b949e" transform="rotate(38 46 0)"/>
    <g transform="rotate(38 46 0) translate(96,-6)">
      <path d="M0,0 L44,10 L44,54 L0,44 Z" fill="#d29922"/>
      <path d="M0,0 L44,10 L44,20 L0,10 Z" fill="#e3b341"/>
      <line x1="6" y1="12" x2="6" y2="46" stroke="#7a5b16" stroke-width="2"/>
      <line x1="16" y1="14" x2="16" y2="48" stroke="#7a5b16" stroke-width="2"/>
      <line x1="26" y1="16" x2="26" y2="50" stroke="#7a5b16" stroke-width="2"/>
      <line x1="36" y1="18" x2="36" y2="52" stroke="#7a5b16" stroke-width="2"/>
    </g>
    <!-- swept sparkles -->
    <circle cx="150" cy="60" r="3" fill="#56d364"/>
    <circle cx="166" cy="44" r="2" fill="#79c0ff"/>
    <circle cx="158" cy="78" r="2.5" fill="#d2a8ff"/>
  </g>

  <!-- title -->
  <text x="280" y="110" fill="#f0f6fc" font-size="52" font-weight="bold">agent-janitor</text>
  <text x="282" y="148" fill="#8b949e" font-size="21">Reclaim AI-agent disk space — preview first, trash to undo.</text>

  <!-- pipeline chips -->
  <g font-size="17">
    <rect x="282" y="172" width="92" height="34" rx="17" fill="#1f6feb"/>
    <text x="328" y="195" fill="#ffffff" text-anchor="middle">SCAN</text>
    <text x="392" y="195" fill="#8b949e">→</text>
    <rect x="410" y="172" width="112" height="34" rx="17" fill="#1f6feb"/>
    <text x="466" y="195" fill="#ffffff" text-anchor="middle">PREVIEW</text>
    <text x="540" y="195" fill="#8b949e">→</text>
    <rect x="558" y="172" width="92" height="34" rx="17" fill="#1f6feb"/>
    <text x="604" y="195" fill="#ffffff" text-anchor="middle">APPLY</text>
    <text x="668" y="195" fill="#8b949e">→</text>
    <rect x="686" y="172" width="112" height="34" rx="17" fill="#8957e5"/>
    <text x="742" y="195" fill="#ffffff" text-anchor="middle">VERIFY</text>
    <text x="816" y="195" fill="#8b949e">→</text>
    <rect x="834" y="172" width="112" height="34" rx="17" fill="#8957e5"/>
    <text x="890" y="195" fill="#ffffff" text-anchor="middle">RESTORE</text>
  </g>

  <!-- reclaim bar -->
  <g>
    <text x="282" y="248" fill="#8b949e" font-size="16">reclaimable</text>
    <rect x="282" y="258" width="664" height="20" rx="10" fill="#21262d"/>
    <rect x="282" y="258" width="470" height="20" rx="10" fill="url(#bar)"/>
    <text x="960" y="274" fill="#3fb950" font-size="18" font-weight="bold">4.1 GB found</text>
  </g>

  <!-- badges -->
  <g font-size="15">
    <rect x="64" y="238" width="150" height="32" rx="6" fill="#21262d" stroke="#30363d"/>
    <text x="139" y="260" fill="#3fb950" text-anchor="middle">✓ read-only scan</text>
  </g>
  <text x="282" y="304" fill="#6e7681" font-size="15">opencode · codex · claude · gemini  —  dry-run default · trash + manifest · proof-gated vacuum</text>
</svg>
