name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js help
      - run: node dist/cli.js scan
      - name: install the packed tarball and run it
        # catches a wrong "files" list, which only bites users after publish
        shell: bash
        run: |
          npm pack
          npm install -g ./agent-janitor-*.tgz
          agent-janitor --version
          agent-janitor scan
          npm uninstall -g agent-janitor
